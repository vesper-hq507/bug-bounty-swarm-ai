id: exchange-proxyshell-rce
name: Microsoft Exchange — ProxyShell → unauthenticated RCE
description: >
  The ProxyShell chain against on-prem Exchange: a pre-auth path-confusion in the
  Autodiscover/Client Access front end (CVE-2021-34473) plus a privilege
  elevation in the PowerShell backend (CVE-2021-34523) reach the Exchange
  PowerShell endpoint, and an arbitrary-file-write (CVE-2021-31207) then plants a
  webshell — unauthenticated RCE. Still exploited years later on unpatched
  servers. Detection + safe verification only.
cves: [CVE-2021-34473, CVE-2021-34523, CVE-2021-31207]
product: Microsoft Exchange Server (2013 / 2016 / 2019)
affected: on-prem Exchange without the July 2021 CU/SU
cvss: 9.8
severity: critical
tags: [exchange, ssrf, path-confusion, file-write, webshell, rce, chained, unauth]
references:
  - https://www.zerodayinitiative.com/blog/2021/8/17/from-pwn2own-2021-a-new-attack-surface-on-microsoft-exchange-proxyshell
fingerprint:
  paths: ["/autodiscover/autodiscover.json", "/owa/", "/ecp/"]
  signals:
    - OWA / ECP login page or Exchange version headers (X-OWA-Version)
    - Autodiscover endpoint responds
  notes: Recover the Exchange build number to confirm it predates the ProxyShell fix.
links:
  - name: "Link 1 — pre-auth path confusion (CVE-2021-34473)"
    cve: CVE-2021-34473
    enables: reach internal Exchange endpoints via the Autodiscover front end
    verify: >
      Probe the Autodiscover path-confusion route read-only and confirm it maps to
      an internal endpoint you should not reach unauthenticated (a distinctive
      response/redirect). No mailbox access, no data read.
  - name: "Link 2 — PowerShell backend elevation (CVE-2021-34523)"
    cve: CVE-2021-34523
    enables: access the Exchange PowerShell endpoint as a privileged context
    verify: >
      Confirm the PowerShell backend is reachable through link 1 (an authenticated
      -looking response to a benign, non-mutating request). Do not run cmdlets.
  - name: "Link 3 — arbitrary file write → webshell (CVE-2021-31207)"
    cve: CVE-2021-31207
    enables: write a file to a web-served path = remote code execution
    verify: >
      Confirm the write primitive is reachable via version/behaviour fingerprint
      only. Do NOT write a file or drop a shell. Report the chain as unauth RCE.
remediation: >
  Apply the latest Exchange Cumulative + Security Updates immediately, then hunt
  for webshells (aspx in front-end paths) and review for prior compromise.
